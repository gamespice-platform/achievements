[plugin]

name="gs-achievements"
description="Achievements declared once as a document a server can check without loading art: rules over stats, tiers, hidden and secret entries, per-player progress with a pluggable store, and a batched backbone reporter. Bridges to gs-stats without naming it. Depends on gs-core and gs-save."
author="dot"
version="0.1.0"
script="gs_achievements_plugin.gd"
